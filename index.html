
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jergan Studio & Bjve Ecosystem</title>
    
    <!-- Google Search Console Verification Meta Tag -->
    <meta name="google-site-verification" content="IU0ESQlwFzjFGmsKH5OXhxWxCqvcqIKzg8Ho5QcxZ10" />

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: #1e1e1e;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffffff;
        }
        p {
            font-size: 14px;
            color: #aaaaaa;
            margin-bottom: 24px;
        }
        .btn-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: block;
            padding: 12px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 6px;
            transition: background 0.2s, transform 0.1s;
            text-align: center;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background-color: #007acc;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0062a3;
        }
        .btn-secondary {
            background-color: #333333;
            color: white;
            border: 1px solid #444444;
        }
        .btn-secondary:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Jergan Studio</h1>
    <p>Select a destination to explore the Bjve Engine development ecosystem.</p>
    
    <div class="btn-wrapper">
        <!-- Button 1: Official Google Site -->
        <a href="https://sites.google.com/view/jerganstudio/home" class="btn btn-primary">
            Visit Jergan Studio Home
        </a>
        
        <!-- Button 2: GitHub Documentation -->
        <a href="https://github.com/jergan-studio/Bjve-documentation" class="btn btn-secondary">
            View Bjve Code Documentation
        </a>
    </div>
</div>

</body>
</html>
